<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 400" width="160" height="400">
  <!-- BOOMiiS sobolo (hibiscus drink) bottle mockup -->
  <defs>
    <linearGradient id="liq" x1="0" x2="1">
      <stop offset="0" stop-color="#3d0612"/><stop offset=".28" stop-color="#8e1430"/><stop offset=".55" stop-color="#b81d42"/><stop offset=".8" stop-color="#7a0f28"/><stop offset="1" stop-color="#36050f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".05"/><stop offset=".15" stop-color="#fff" stop-opacity=".55"/><stop offset=".22" stop-color="#fff" stop-opacity=".08"/><stop offset=".78" stop-color="#fff" stop-opacity=".02"/><stop offset=".86" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" x2="1">
      <stop offset="0" stop-color="#4d1020"/><stop offset=".35" stop-color="#c13a57"/><stop offset=".6" stop-color="#a3304a"/><stop offset="1" stop-color="#4d1020"/>
    </linearGradient>
    <linearGradient id="label" x1="0" x2="1">
      <stop offset="0" stop-color="#cdb98f"/><stop offset=".25" stop-color="#fbf3e2"/><stop offset=".6" stop-color="#f3e6c9"/><stop offset="1" stop-color="#bba57a"/>
    </linearGradient>
    <clipPath id="body"><path d="M58 40h44v20c0 12 30 26 30 52v240c0 18-12 30-30 30H58c-18 0-30-12-30-30V112c0-26 30-40 30-52z"/></clipPath>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="80" cy="388" rx="62" ry="10" fill="url(#shadow)"/>
  <!-- bottle + liquid -->
  <g clip-path="url(#body)">
    <rect x="0" y="40" width="160" height="360" fill="url(#liq)"/>
    <rect x="0" y="40" width="160" height="34" fill="#fff" opacity=".12"/>
    <!-- bubbles / condensation -->
    <g fill="#fff" opacity=".55">
      <circle cx="46" cy="140" r="2.2"/><circle cx="118" cy="168" r="1.6"/><circle cx="40" cy="300" r="2"/><circle cx="120" cy="320" r="2.4"/><circle cx="52" cy="330" r="1.4"/><circle cx="112" cy="132" r="1.8"/><circle cx="38" cy="220" r="1.3"/><circle cx="124" cy="250" r="1.5"/>
    </g>
    <rect x="0" y="40" width="160" height="360" fill="url(#glass)"/>
  </g>
  <path d="M58 40h44v20c0 12 30 26 30 52v240c0 18-12 30-30 30H58c-18 0-30-12-30-30V112c0-26 30-40 30-52z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
  <!-- cap -->
  <rect x="54" y="8" width="52" height="36" rx="6" fill="url(#cap)"/>
  <g stroke="#2e0812" stroke-opacity=".35" stroke-width="1.5"><path d="M60 10v32M66 10v32M72 10v32M78 10v32M84 10v32M90 10v32M96 10v32M102 10v32"/></g>
  <rect x="50" y="40" width="60" height="7" rx="3" fill="#7a1f33"/>
  <!-- label -->
  <rect x="28" y="168" width="104" height="132" fill="url(#label)"/>
  <rect x="28" y="168" width="104" height="9" fill="#a3304a"/>
  <rect x="28" y="291" width="104" height="9" fill="#1f5a3d"/>
  <text x="80" y="198" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="13" fill="#a3304a" letter-spacing=".5">BOOM<tspan fill="#1f5a3d">ii</tspan>S</text>
  <!-- hibiscus flower -->
  <g transform="translate(80 232)">
    <g fill="#c8203f">
      <ellipse rx="9" ry="15" transform="rotate(0) translate(0 -11)"/><ellipse rx="9" ry="15" transform="rotate(72) translate(0 -11)"/><ellipse rx="9" ry="15" transform="rotate(144) translate(0 -11)"/><ellipse rx="9" ry="15" transform="rotate(216) translate(0 -11)"/><ellipse rx="9" ry="15" transform="rotate(288) translate(0 -11)"/>
    </g>
    <circle r="5" fill="#6d0a1f"/>
    <path d="M0 0l10 -14" stroke="#f2b544" stroke-width="2" stroke-linecap="round"/><circle cx="10.5" cy="-14.5" r="2.3" fill="#f2b544"/>
  </g>
  <text x="80" y="275" text-anchor="middle" font-family="Anton, sans-serif" font-size="25" fill="#1a0d08" letter-spacing="1">SOBOLO</text>
  <text x="80" y="288" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="7.5" fill="#5a3b2a" letter-spacing="1.2">CHILLED HIBISCUS</text>
  <!-- glass highlight over label -->
  <rect x="40" y="70" width="9" height="290" rx="4.5" fill="#fff" opacity=".28"/>
</svg>
